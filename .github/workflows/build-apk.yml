name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Initialize and Sync Capacitor
        run: |
          # Install Capacitor core, CLI, and Android packages if not present
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          
          # Create capacitor.config.json if not present
          if [ ! -f "capacitor.config.json" ]; then
            echo '{
              "appId": "com.wildaansaiyed.mothertree",
              "appName": "Mother Tree Ecosystem",
              "webDir": "dist",
              "bundledWebRuntime": false
            }' > capacitor.config.json
          fi

          # Create the android project directory if not present
          if [ ! -d "android" ]; then
            npx cap add android
          fi

          # Synchronize build assets into the Android folder
          npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android App with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mother-tree-ecosystem-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
